project:
  type: book
  output-dir: _book

book:
  title: "[Architecting Solutions in AWS: Requirements to Justified Trade-offs.](https://senthilkumarm1901.github.io/learn_by_blogging/aws_architecting_solutions/10-architecting-serverless-backend-solution-in-aws.html)"
  author: "Senthil Kumar"
  chapters:
    - index.qmd
    - 10-architecting-serverless-backend-solution-in-aws.qmd
    - 11-serverless-data-analytics.qmd
    - 12-hybrid-container-workloads.qmd
    - 13-multi-account-strategies.qmd
    - 14-capstone-decoupled-app-and-emr-analytics.qmd

# Mermaid's Quarto/Bootstrap theming renders subgraph backgrounds near-black
# (quarto-cli#9178); the built-in neutral theme avoids it.
mermaid:
  theme: neutral

format:
  html:
    theme: cosmo
    css: book.css
    number-sections: false
    navbar:
      right:
        - text: "Blog"
          href: "https://senthilkumarm1901.github.io/learn_by_blogging/blog.html"
          target: _self
        - text: "GitHub"
          href: "https://github.com/senthilkumarm1901"
          target: _blank
        - text: "LinkedIn"
          href: "https://www.linkedin.com/in/senthilkumarm1901"
          target: _blank
        - text: "Medium"
          href: "https://medium.com/@senthilkumar.m1901"
          target: _blank